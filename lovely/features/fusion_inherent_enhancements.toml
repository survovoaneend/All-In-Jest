# Add tootip for inherent effects
# generate_card_ui()
[[patches]]
[patches.pattern]
target = "functions/common_events.lua"
pattern = "if _c.set == 'Other' then"
position = "before"
match_indent = true
payload = '''
if _c.is_inherent_edition then
    desc_nodes.name = ' '..localize('k_aij_inherent')..' '..localize{type = 'name_text', key = _c.edition_key, set = 'Edition'}..' '
end
if _c.is_inherent_enhancement then
    desc_nodes.name = ' '..localize('k_aij_inherent')..' '..localize{type = 'name_text', key = _c.enhancement_key, set = 'Enhanced'}..' '
end
if card and card.aij_inherent_effects then
    for k, v in pairs(card.aij_inherent_effects) do
        for _k, _v in pairs(card.aij_inherent_effects[k]) do
            if k == 'enhancements' then
                local enhancement_key = _v.center_key
                if G.P_CENTERS[enhancement_key] and G.P_CENTERS[enhancement_key].set == 'Enhanced' then
                    local t = SMODS.shallow_copy(G.P_CENTERS[enhancement_key])
                    t.is_inherent_enhancement = true
                    t.enhancement_key = enhancement_key
                    t.specific_vars = t.specific_vars or {}
                    if _v.ability.bonus > 0 then
                        t.specific_vars.bonus_chips = _v.ability.bonus
                    end
                    info_queue[#info_queue + 1] = t
                end
            elseif k == 'editions' then
                local ed_key = _v.key
                local localization_key = _v.key
                if G.P_CENTERS[ed_key] and G.P_CENTERS[ed_key].set == 'Edition' then
                    if G.P_CENTERS[ed_key].config.card_limit then
                        localization_key = "e_" .. G.P_CENTERS[ed_key]:card_limit_key(card)
                        if localization_key:sub(localization_key:len()-14) == '_SMODS_INTERNAL' then
                            localization_key = localization_key:sub(1, localization_key:len()-15)
                            if localization_key == "e_negative_playing_card" then
                                localization_key = "e_aij_negative_playing_card"
                            end
                        end
                    end

                    local t = {key = localization_key, set = 'Edition', config = {}}
                    if localize(SMODS.merge_defaults(t, {type = 'name_text'})) == 'ERROR' then t.key = localization_key end
                    t.type = nil
                    t.is_inherent_edition = true
                    t.edition_key = ed_key
                    info_queue[#info_queue + 1] = t
                    local fake_card = {edition = _v}

                    if G.P_CENTERS[ed_key].loc_vars and type(G.P_CENTERS[ed_key].loc_vars) == 'function' then
                        local res = G.P_CENTERS[ed_key]:loc_vars(info_queue, fake_card) or {}
                        t.vars = res.vars
                        t.key = res.key or t.key
                        t.set = res.set or t.set
                    end
                end
            end
        end
    end
end
'''


# Adding compatability between context.setting_ability and fusion enhancements
# Card.set_ability() SMODS hook
[[patches]] 
[patches.pattern]
target = '=[SMODS _ "src/overrides.lua"]'
pattern = "set_ability(self, center, initial, delay_sprites)"
position = "after"
payload = '''
if self.aij_setting_other_enhancement_back then
    self.aij_setting_other_enhancement_back = nil
    self.front_hidden = self:should_hide_front()
    return
end
if self.aij_setting_other_enhancement then
    if not initial and (G.STATE ~= G.STATES.SMODS_BOOSTER_OPENED and G.STATE ~= G.STATES.SHOP and not G.SETTINGS.paused or G.TAROT_INTERRUPT) then
		SMODS.calculate_context({setting_ability = true, old = self.aij_setting_other_enhancement, new = self.config.center_key, other_card = self, unchanged = self.aij_setting_other_enhancement == self.config.center.key})
	end
    self.aij_setting_other_enhancement = nil
    self.front_hidden = self:should_hide_front()
    return
end
'''
match_indent = true



# Remove "+x hand size" info box when card has inherent negative (1/2)
# generate_card_ui()
[[patches]]
[patches.pattern]
target = "functions/common_events.lua"
pattern = """if not (card.edition and card.edition.card_limit == card.ability.card_limit) then
    local amount = card.ability.card_limit - (card.edition and card.edition.card_limit or 0)"""
position = "after"
match_indent = true
payload = '''
    if card.aij_inherent_effects and card.aij_inherent_effects.editions then
        for i, effect in ipairs(card.aij_inherent_effects.editions) do
            amount = amount - (effect.card_limit or 0)
        end
    end
'''

# Remove "+x hand size" info box when card has inherent negative (2/2)
# generate_card_ui()
[[patches]]
[patches.regex]
target = "functions/common_events.lua"
pattern = "(?<indent>[\t ]*)(?<content>info_queue\\[#info_queue \\+ 1\\] = \\{set = 'Other', key = .* vars =\\{math\\.abs\\(amount\\).*)"
position = "at"
line_prepend = '$indent'
payload = '''
if amount ~= 0 then
  $content
end
'''



# Add extra desc box for vanilla fused enhancements
# Modded enhancements (and overidden vanilla ones) are tied into generate_ui
# generate_card_ui()
[[patches]]
[patches.pattern]
target = "functions/common_events.lua"
pattern = "SMODS.localize_perma_bonuses(specific_vars, desc_nodes)"
position = "after"
match_indent = true
payload = '''
    if card and card.config and card.config.aij_other_center then
        local aij_o_c = card.config.aij_other_center['center']
        local aij_ocfg = card.config.aij_other_center['ability']
        local fake_card = {config = {center = aij_o_c}, ability = aij_ocfg}
        local res = {}
        if aij_o_c.loc_vars and type(aij_o_c.loc_vars) == 'function' then
            res = aij_o_c:loc_vars(nil, fake_card) or {}
        end
        if aij_o_c.effect == 'Mult Card' then loc_vars = {SMODS.signed(aij_ocfg.mult)}
        elseif aij_o_c.effect == 'Wild Card' then
        elseif aij_o_c.effect == 'Glass Card' then loc_vars = {aij_ocfg.Xmult, SMODS.get_probability_vars(card, 1, aij_ocfg.extra, 'glass')}
        elseif aij_o_c.effect == 'Steel Card' then loc_vars = {aij_ocfg.h_x_mult}
        elseif aij_o_c.effect == 'Stone Card' then loc_vars = {aij_ocfg.bonus and SMODS.signed(aij_ocfg.bonus) or 0}
        elseif aij_o_c.effect == 'Gold Card' then loc_vars = {SMODS.signed_dollars(aij_ocfg.h_dollars)}
        elseif aij_o_c.effect == 'Lucky Card' then loc_vars = {G.GAME.probabilities.normal, aij_ocfg.mult, 5, aij_ocfg.p_dollars, 15}
        end
        local AUT = localize{type = 'descriptions', key = aij_o_c.key, set = aij_o_c.set, nodes = desc_nodes, vars = res.vars or loc_vars, all_in_jest = {add_box = true}}
        full_UI_table.multi_box = AUT.multi_box
        full_UI_table.box_colours = AUT.box_colours
        if aij_o_c.name ~= 'Stone Card' and (aij_ocfg.bonus ~= 0 and aij_ocfg.bonus) then
            localize{type = 'other', key = 'card_extra_chips', nodes = desc_nodes, vars = {SMODS.signed(aij_ocfg.bonus)}}
        end
        card.front_hidden = card:should_hide_front()
    end
'''


