[manifest]
version = "1.0.0"
dump_lua = true
priority = 214748364


# Inherent effect calculation
# SMODS.trigger_effects()
[[patches]]
[patches.pattern]
target = '=[SMODS _ "src/utils.lua"]'
pattern = "for _, key in ipairs({'jokers', 'retriggers'}) do"
position = "before"
payload = '''
if card and card.aij_inherent_effects then
    local i = 0
    local j = 0
    for k, v in pairs(card.aij_inherent_effects) do
        i = i + 1
        for _k, _v in pairs(card.aij_inherent_effects[k]) do
            j = j + 1
            local v = 'aij_inherent_effects'..j..i
            SMODS.calculate_effect_table_key(effect_table, v, card, ret)
        end
    end
end
'''
match_indent = true

# Add calculation for inherent enhancements
# SMODS.calculate_quantum_enhancements
[[patches]]
[patches.pattern]
target = '=[SMODS _ "src/utils.lua"]'
pattern = "if not SMODS.optional_features.quantum_enhancements then return end"
position = "before"
payload = '''
if not (context.aij_inherent_enhancement or context.aij_other_enhancement or SMODS.aij_inherent_enhancement_calc_in_progress) then
    if card.aij_inherent_effects then
        context.aij_inherent_enhancement = true
        context.extra_enhancement = true
        SMODS.aij_inherent_enhancement_calc_in_progress = true
        local aij_inherent_enhancements = All_in_Jest.get_inherent_effects(card, 'enhancement')
        local old_ability = copy_table(card.ability)
        local old_center = card.config.center
        local old_center_key = card.config.center_key
        for _, k in ipairs(aij_inherent_enhancements) do
            card.ability = k['ability']
            card.config.center = G.P_CENTERS[k.center_key]
            card.config.center_key = k.center_key
            card.ability.aij_inherent_enhancement = k['center']
            local eval = eval_card(card, context)
            table.insert(effects, eval)
        end
        card.ability = old_ability
        card.config.center = old_center
        card.config.center_key = old_center_key
        context.aij_inherent_enhancement = nil
        context.extra_enhancement = nil
        SMODS.aij_inherent_enhancement_calc_in_progress = nil
    end
end
if card.config.aij_other_center and not (context.aij_inherent_enhancement or context.aij_other_enhancement) and not SMODS.aij_applying_thing and not SMODS.aij_inherent_enhancement_calc_in_progress then
    if card.config.aij_other_center['center'] and card.config.aij_other_center['ability'] then
        context.aij_other_enhancement = true
        context.extra_enhancement = true
        SMODS.aij_inherent_enhancement_calc_in_progress = true

        local aij_oc = card.config.aij_other_center
        
        local old_ability = copy_table(card.ability)
        local old_center = card.config.center
        local old_center_key = card.config.center_key

        card.ability = card.config.aij_other_center['ability']
        card.config.center = aij_oc['center']
        card.config.center_key = aij_oc['center'].key

        local temp_bonus = card.ability.bonus
        card.ability.bonus = 0
        local eval = eval_card(card, context)
        table.insert(effects, eval)
        card.ability.bonus = card.ability.bonus + temp_bonus

        card.ability = old_ability
        card.config.center = old_center
        card.config.center_key = old_center_key

        context.aij_other_enhancement = nil
        context.extra_enhancement = nil
        SMODS.aij_inherent_enhancement_calc_in_progress = nil
    end
end
'''
match_indent = true

# Fusion Enhancements
# Card:load()
## Correctly load fused and inherent enhancements
[[patches]]
[patches.pattern]
target = 'card.lua'
pattern = 'self.config.center = G.P_CENTERS[self.config.center_key]'
position = "after"
match_indent = true
payload = '''
if cardTable.save_fields.aij_other_center then
    self.config.aij_other_center = {}
    self.config.aij_other_center['center'] = G.P_CENTERS[cardTable.save_fields.aij_other_center]
    self.config.aij_other_center['ability'] = cardTable.aij_other_center_ability
end

if cardTable.aij_inherent_effects then
    self.aij_inherent_effects = cardTable.aij_inherent_effects
end
'''

# Set fused enhancements when copying card
# copy_card() (before setting sprites)
[[patches]]
[patches.pattern]
target = "functions/common_events.lua"
pattern = "if new_card.ability and (new_card.ability.set == 'Default' or new_card.ability.set == 'Enhanced') then"
position = "before"
match_indent = true
payload = '''
if other.config.aij_other_center then
    All_in_Jest.set_other_enhancement(new_card, other.config.aij_other_center['center'].key)
end
'''

# Copy inherent effects
# copy_card()
[[patches]]
[patches.pattern]
target = "functions/common_events.lua"
pattern = "if not strip_edition then"
position = "before"
match_indent = true
payload = '''
if other.aij_inherent_effects then
    new_card.aij_inherent_effects = {}
    for k,v in pairs(other.aij_inherent_effects or {}) do
        if type(v) == 'table' then
            new_card.aij_inherent_effects[k] = copy_table(v)
        else
            new_card.aij_inherent_effects[k] = v
        end
    end
end
'''

