[patches.pattern]
target = "functions/common_events.lua"
pattern = "if specific_vars and _c.name ~= 'Stone Card' and specific_vars.nominal_chips then"
position = "before"
match_indent = true
payload = '''
if (card and card.config and card.config.aij_other_center and card.config.aij_other_center['center'] and card.config.aij_other_center['center'].name  ~= 'Stone Card') or (not card or (card and not card.config or (card and card.config and not card.config.aij_other_center))) then
'''

# Prevent fused stone cards from showing nominal chips tooltip (2/2)
# generate_card_ui()
[[patches]]
[patches.pattern]
target = "functions/common_events.lua"
pattern = "if _c.effect == 'Mult Card' then loc_vars = {SMODS.signed(cfg.mult)}"
position = "before"
match_indent = true
payload = '''
end
'''


# Add image_data to vanilla atlases (1/3)
# Game:set_render_setting()
[[patches]]
[patches.pattern]
target = 'game.lua'
pattern = '''self.ANIMATION_ATLAS[self.animation_atli[i].name].image = *'''
position = 'after'
payload = '''
self.ANIMATION_ATLAS[self.animation_atli[i].name].image_data = love.image.newImageData(self.animation_atli[i].path)
'''
match_indent = true
# Add image_data to vanilla atlases (2/3)
# Game:set_render_setting()
[[patches]]
[patches.pattern]
target = 'game.lua'
pattern = '''self.ASSET_ATLAS[self.asset_atli[i].name].image = *'''
position = 'after'
payload = '''
self.ASSET_ATLAS[self.asset_atli[i].name].image_data = love.image.newImageData(self.asset_atli[i].path)
'''
match_indent = true
# Add image_data to vanilla atlases (3/3)
# Game:set_render_setting()
[[patches]]
[patches.pattern]
target = 'game.lua'
pattern = '''self.ASSET_ATLAS[self.asset_images[i].name].image = *'''
