# Seems to force descriptions to seperate fused enhancement abilities into two boxes
# Not sure if this is working correctly as of v0.7.2a
# TODO: Investigate
# localize()
[[patches]]
[patches.pattern]
target = "functions/misc_functions.lua"
pattern = "if (args.type == 'descriptions' or args.type == 'other') and type(loc_target.text) == 'table' and type(loc_target.text[1]) == 'table' then"
position = "before"
match_indent = true
payload = '''
if args.all_in_jest and args.all_in_jest.add_box then
    args.AUT.multi_box = args.AUT.multi_box or {} 
    if (args.type == 'descriptions' or args.type == 'other') and type(loc_target.text) == 'table' and type(loc_target.text[1]) == 'table' then
        for i, box in ipairs(loc_target.text_parsed) do
            for j, line in ipairs(box) do
                local final_line = SMODS.localize_box(line, args)
                args.nodes.main_box_flag = true
                args.AUT.multi_box[i] = args.AUT.multi_box[i] or {}
                args.AUT.multi_box[i][#args.AUT.multi_box[i]+1] = final_line
                args.AUT.box_colours[i] = args.vars.box_colours and args.vars.box_colours[i] or G.C.UI.BACKGROUND_WHITE
            end
        end
        return args.AUT
    end
    for _, lines in ipairs(args.type == 'unlocks' and loc_target.unlock_parsed or args.type == 'name' and loc_target.name_parsed or (args.type == 'text' or args.type == 'tutorial' or args.type == 'quips') and loc_target or loc_target.text_parsed) do
        local final_line = SMODS.localize_box(lines, args)
        args.nodes.main_box_flag = true
        args.AUT.multi_box[1] = args.AUT.multi_box[1] or {}
        args.AUT.multi_box[1][#args.AUT.multi_box[1]+1] = final_line
        args.AUT.box_colours[1] = args.vars.box_colours and args.vars.box_colours[1] or G.C.UI.BACKGROUND_WHITE
    end
    return args.AUT
end
'''


