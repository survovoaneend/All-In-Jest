[manifest]
version = "1.0.0"
dump_lua = true
priority = 214748364

# Prevents tooltip for the coconut from appearing
# Card:hover()
[[patches]]
[patches.pattern]
target = "card.lua"
pattern = "if self.facing == 'front' and (not self.states.drag.is or G.CONTROLLER.HID.touch)*"  # Find a line inside Card:hover() before the tooltip logic
position = "before"
match_indent = true
payload = '''
-- Prevent tooltip for Guess the Jest cards while in the pack
if self.ability.jest_got_no_ui then
    return
end
'''

# Adds special use button for off-screen coconut
# G.UIDEF.use_and_sell_buttons()
[[patches]]
[patches.pattern]
target = "functions/UI_definitions.lua"
pattern = '''
if card.ability.consumeable and card.area == G.pack_cards and G.pack_cards and booster_obj then
'''
position = "before"
payload = '''
if card.area and card.area == G.aij_coconut_holder then
    sell = nil
    local use_button = {n=G.UIT.T, config={text = localize('k_delete'),colour = G.C.UI.TEXT_LIGHT, scale = 0.55, shadow = true}}
    aij_activate_ability = {n=G.UIT.C, config={align = "cr"}, nodes={
        {n=G.UIT.C, config={ref_table = card, align = "cr",maxw = 1.25, padding = 0.1, r=0.08, minw = 1.25, minh = (card.area and card.area.config.type == 'joker') and 0 or 1.3, hover = true, shadow = true, colour = G.C.RED, button = 'aij_coconut_delete'}, nodes={
            {n=G.UIT.B, config = {w=0.1,h=-0.3}},
            use_button,
        }}
    }}
end
'''
match_indent = true
