[manifest]
version = "1.0.0"
dump_lua = true
priority = 214748364


# Fixed a number of vanilla effects that do not call SMODS.destroy_cards
# Why SMODS has not done this yet is beyond me

# Hanged Man
# Card.use_consumeable()
[[patches]]
[patches.pattern]
target = 'card.lua'
match_indent = true
position = 'at'
pattern = '''
G.E_MANAGER:add_event(Event({
    trigger = 'after',
    delay = 0.2,
    func = function() 
        for i=#G.hand.highlighted, 1, -1 do
            local card = G.hand.highlighted[i]
            if SMODS.shatters(card) then
                card:shatter()
            else
                card:start_dissolve(nil, i == #G.hand.highlighted)
            end
        end
        return true end }))
'''
payload = '''
--[[
G.E_MANAGER:add_event(Event({
    trigger = 'after',
    delay = 0.2,
    func = function() 
        for i=#G.hand.highlighted, 1, -1 do
            local card = G.hand.highlighted[i]
            if SMODS.shatters(card) then
                card:shatter()
            else
                card:start_dissolve(nil, i == #G.hand.highlighted)
            end
        end
        return true end }))
]]--
SMODS.destroy_cards(G.hand.highlighted, {delay = 0.2}) -- AIJ Override
'''

# Immolate
# Card.use_consumeable()
[[patches]]
[patches.pattern]
target = 'card.lua'
match_indent = true
position = 'at'
pattern = '''
G.E_MANAGER:add_event(Event({
    trigger = 'after',
    delay = 0.1,
    func = function() 
        for i=#destroyed_cards, 1, -1 do
            local card = destroyed_cards[i]
            if SMODS.shatters(card) then
                card:shatter()
            else
                card:start_dissolve(nil, i == #destroyed_cards)
            end
        end
        return true end }))
'''
payload = '''
--[[ 
G.E_MANAGER:add_event(Event({
    trigger = 'after',
    delay = 0.1,
    func = function() 
        for i=#destroyed_cards, 1, -1 do
            local card = destroyed_cards[i]
            if SMODS.shatters(card) then
                card:shatter()
            else
                card:start_dissolve(nil, i == #destroyed_cards)
            end
        end
        return true end }))
]]--
delay(0.1)
SMODS.destroy_cards(destroyed_cards) -- AIJ Override
'''

# Remove what would otherwise be an unecessary context call (1/2)
# This is for hanged man and immolate
# Card.use_consumeable()
[[patches]]
[patches.regex]
target = 'card.lua'
position = 'at'
pattern = '''(SMODS\.calculate_context\(\{ remove_playing_cards = true, removed = destroyed_cards.*)'''
payload = '''-- AIJ Override -- $1'''


# Familiar, Incantation and Grim
# SMODs local function random_destroy()
[[patches]]
[patches.pattern]
target = '=[SMODS _ "src/game_object.lua"]'
match_indent = true
position = 'at'
pattern = '''
G.E_MANAGER:add_event(Event({
    trigger = 'after',
    delay = 0.1,
    func = function()
        for i = #destroyed_cards, 1, -1 do
            local card = destroyed_cards[i]
            if SMODS.shatters(card) then
                card:shatter()
            else
                card:start_dissolve(nil, i ~= #destroyed_cards)
            end
        end
        return true
    end
}))
'''
payload = '''
--[[
G.E_MANAGER:add_event(Event({
    trigger = 'after',
    delay = 0.1,
    func = function()
        for i = #destroyed_cards, 1, -1 do
            local card = destroyed_cards[i]
            if SMODS.shatters(card) then
                card:shatter()
            else
                card:start_dissolve(nil, i ~= #destroyed_cards)
            end
        end
        return true
    end
}))
]]--
delay(0.1)
SMODS.destroy_cards(destroyed_cards) -- AIJ Override
'''

# Remove what would otherwise be an unecessary context call (2/2)
# This one is for Grim, Incantation, & Familiar
# SMODs overrides
[[patches]]
[patches.regex]
target = '=[SMODS _ "src/game_object.lua"]'
position = 'at'
times = 3
pattern = '''(SMODS\.calculate_context\(\{ remove_playing_cards = true, removed = destroyed_cards.*)'''
payload = '''-- AIJ Override -- $1'''


# Ankh
# Card.use_consumeable()
[[patches]]
[patches.pattern]
target = 'card.lua'
match_indent = true
position = 'at'
pattern = 'v:start_dissolve(nil, _first_dissolve)'
payload = '''
-- v:start_dissolve(nil, _first_dissolve)
SMODS.destroy_cards(v, {silent = _first_dissolve, immediate = true}) -- AIJ Override
'''

# Hex
# Card.use_consumeable()
[[patches]]
[patches.pattern]
target = 'card.lua'
match_indent = true
position = 'at'
pattern = 'if v ~= eligible_card and (not SMODS.is_eternal(v, self)) then v.getting_sliced = true; v:start_dissolve(nil, _first_dissolve);_first_dissolve = true end'
payload = '''
-- if v ~= eligible_card and (not SMODS.is_eternal(v, self)) then v.getting_sliced = true; v:start_dissolve(nil, _first_dissolve);_first_dissolve = true end
if v ~= eligible_card and (not SMODS.is_eternal(v, self)) then v.getting_sliced = true; SMODS.destroy_cards(v, {silent = _first_dissolve, immediate = true});_first_dissolve = true end -- AIJ Override
'''

# Madness
