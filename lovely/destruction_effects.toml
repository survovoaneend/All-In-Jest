# Trading Card (and other on discard destruction effects)
# Card.calculate()
[[patches]]
[patches.pattern]
target = 'functions/state_events.lua'
match_indent = true
position = 'at'
pattern = '''
if SMODS.shatters(G.hand.highlighted[i]) then
    G.hand.highlighted[i]:shatter()
else
    G.hand.highlighted[i]:start_dissolve()
end
'''
payload = '''
--[[
if SMODS.shatters(G.hand.highlighted[i]) then
    G.hand.highlighted[i]:shatter()
else
    G.hand.highlighted[i]:start_dissolve()
end
]]--
SMODS.destroy_cards(G.hand.highlighted[i], {immediate = true}) -- AIJ Override
'''

# Remove what would otherwise be an unecessary context call (3/4)
# This one is for Trading Card
# G.FUNCS.discard_cards_from_highlighted()
[[patches]]
[patches.regex]
target = 'functions/state_events.lua'
position = 'at'
pattern = '''(SMODS\.calculate_context\(\{remove_playing_cards = true, removed = destroyed_cards.*)'''
payload = '''-- AIJ Override -- $1'''


# Glass Cards (and other post-hand destruction effects)
# Card.calculate()
[[patches]]
[patches.pattern]
target = 'functions/state_events.lua'
match_indent = true
position = 'at'
pattern = '''
if cards_destroyed[i].shattered then
    cards_destroyed[i]:shatter()
else
    cards_destroyed[i]:start_dissolve()
end
'''
payload = '''
--[[
if cards_destroyed[i].shattered then
    cards_destroyed[i]:shatter()
else
    cards_destroyed[i]:start_dissolve()
end
]]--
SMODS.destroy_cards(cards_destroyed[i], {immediate = true}) -- AIJ Override
'''

# Remove what would otherwise be an unecessary context call (4/4)
# This one is for glass cards and similar after hand destruction effects
# G.FUNCS.discard_cards_from_highlighted()
[[patches]]
[patches.regex]
target = 'functions/state_events.lua'
position = 'at'
pattern = '''(SMODS\.calculate_context\(\{scoring_hand = scoring_hand, remove_playing_cards = true, removed = cards_destroyed.*)'''
payload = '''-- AIJ Override -- $1'''

# Glass Joker
# Remove unecessary context check when using hanged man
# This is a bug that is fixed when using SMODS.destroy_cards
[[patches]]
[patches.regex]
target = 'card.lua'
position = 'at'
pattern = '''if (self\.ability\.name == 'Glass Joker' and not context\.blueprint and context\.consumeable\.ability\.name == 'The Hanged Man'.*)'''
payload = '''if false and $1 -- AIJ Override'''