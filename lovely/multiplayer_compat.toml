[manifest]
version = "1.0.0"
dump_lua = true
priority = 214748364

# I think this would ideally be a thing to make a PR for, but this is early days
[[patches]]
[patches.pattern]
target = '=[SMODS Multiplayer "core.lua"]'
pattern = 'PVP.load_mp_dir("compatibility")'
position = "after"
payload = '''
do -- All in Jest multiplayer patch 
  if next(SMODS.find_mod("allinjest")) then
	  sendDebugMessage("All in Jest compatibility detected", "MULTIPLAYER")
    PVP.DECK.ban_card("j_aij_blood_artist") -- Messes with blind req.
    -- PVP.DECK.ban_card("j_aij_fall_of_count_chaligny") -- Messes with blind req.
    PVP.DECK.ban_card("j_aij_pedrolino") -- Messes with blind req.
    PVP.DECK.ban_card("j_aij_blind_drawn") -- Downside becomes irrelevant
    PVP.DECK.ban_card("j_aij_stultor") -- Rerolls blind
    PVP.DECK.ban_card("j_aij_hofnarr_the_barbarian") -- Only cares about showdown blinds
    PVP.DECK.ban_card("j_aij_eulenspiegel") -- Messes with the current Ante
    PVP.DECK.ban_card("j_aij_scarab") -- Messes with the current Ante
    PVP.DECK.ban_card("j_aij_atemporal_taco") -- Messes with the current Ante
    PVP.DECK.ban_card("j_aij_jokey_bear") -- Downside becomes irrelevant
    PVP.DECK.ban_card("c_aij_spica") -- Let's you disable boss

    PVP.DECK.ban_tag("tag_aij_dominus") -- Can reroll blind

    -- Ban boss blinds that increase score requirement
    -- Used for option to combine pvp blind with a boss blind
    PVP.DECK.ban_blind("bl_aij_the_groan")
    PVP.DECK.ban_blind("bl_aij_the_ash")
    PVP.DECK.ban_blind("bl_aij_the_clay")
    PVP.DECK.ban_blind("bl_aij_the_aspen")
    PVP.DECK.ban_blind("bl_aij_the_evergreen")
    PVP.DECK.ban_blind("bl_aij_the_giant")
    PVP.DECK.ban_blind("bl_aij_the_celebration")
    PVP.DECK.ban_blind("bl_aij_the_hoard")
    PVP.DECK.ban_blind("bl_aij_the_mountain")
    PVP.DECK.ban_blind("bl_aij_the_brilliance")
    PVP.DECK.ban_blind("bl_aij_the_clown")
    PVP.DECK.ban_blind("bl_aij_the_connection")
    PVP.DECK.ban_blind("bl_aij_aureate_coin")
    PVP.DECK.ban_blind("bl_aij_mysterious_myriad")
    PVP.DECK.ban_blind("bl_aij_fallen_falcon")

    PVP.DECK.ban_blind("bl_aij_the_journey")
  end
end -- End of All in Jest multiplayer patch
'''
match_indent = true

[[patches]]
[patches.pattern]
target = '=[SMODS Multiplayer "core.lua"]'
pattern = 'PVP.load_mp_dir("gamemodes")'
position = "after"
payload = '''
do -- All in Jest multiplayer patch 
  if next(SMODS.find_mod("allinjest")) then
    for _, t in ipairs({PVP.Gamemodes.gamemode_mp_attrition, PVP.Gamemodes.gamemode_mp_showdown}) do
      table.insert(t.reworked_jokers, "j_aij_mp_blind_drawn")
    end
    sendDebugMessage(tprint(PVP.Gamemodes.gamemode_mp_attrition), "AIJ")
  end
end -- End of All in Jest multiplayer patch
'''
match_indent = true

# Multiplayer Blind Drawn (1/5)
# Hide's nemesis' score
# G.FUNCS.multiplayer_blind_chip_UI_scale()
[[patches]]
[patches.pattern]
target = '=[SMODS Multiplayer "ui/game.lua"]'
pattern = "PVP.GAME.enemy.score_text = new_score_text"
position = "before"
payload = '''
do -- All in Jest multiplayer patch 
    if next(SMODS.find_card("j_aij_mp_blind_drawn")) then
        new_score_text = "???" -- Redundancy in case other patch fails
        e.config.scale = 0.7
    end
end -- End of All in Jest multiplayer patch
'''
match_indent = true

# Multiplayer Blind Drawn (2/5)
# Hide's nemesis' score
# Set here as well so the score display actually updates
# G.FUNCS.multiplayer_blind_chip_UI_scale()
[[patches]]
[patches.pattern]
target = '=[SMODS Multiplayer "ui/game.lua"]'
pattern = "local new_score_text = PVP.INSANE_INT.to_string(PVP.GAME.enemy.score)"
position = "after"
payload = '''
if next(SMODS.find_card("j_aij_mp_blind_drawn")) then -- All in Jest multiplayer patch 
    new_score_text = "???"
end -- End of All in Jest multiplayer patch
'''
match_indent = true

# Multiplayer Blind Drawn (3/5)
# Hides nemesis' hands remaining
# update_blind_HUD()
[[patches]]
[patches.pattern]
target = '=[SMODS Multiplayer "ui/game.lua"]'
pattern = '{ { ref_table = PVP.GAME.enemy, ref_value = "hands" } }'
position = "before"
payload = '''
next(SMODS.find_card("j_aij_mp_blind_drawn")) and { { ref_table = {hands = "?"}, ref_value = "hands" } } or 
'''
match_indent = true

# Multiplayer Blind Drawn (4/5)
# Stop blind score and hands remaining from juicing up when nemesis scores
# action_enemy_info()
[[patches]]
[patches.pattern]
target = '=[SMODS Multiplayer "ui/game/blind_hud.lua"]'
pattern = '''
G.HUD_blind:get_UIE_by_ID("HUD_blind_count"):juice_up()
G.HUD_blind:get_UIE_by_ID("dollars_to_be_earned"):juice_up()
'''
position = "at"
payload = '''
if not next(SMODS.find_card("j_aij_mp_blind_drawn")) then -- All in Jest multiplayer patch 
 		G.HUD_blind:get_UIE_by_ID("HUD_blind_count"):juice_up()
		G.HUD_blind:get_UIE_by_ID("dollars_to_be_earned"):juice_up()
end -- End of All in Jest multiplayer patch
'''
match_indent = true

# Multiplayer Blind Drawn (5/5)
# Hide opponent's highest score in lobby info screen
# action_enemy_info()
[[patches]]
[patches.pattern]
target = '=[SMODS Multiplayer "ui/hud.lua"]'
pattern = "text = PVP.INSANE_INT.to_string(highest_score),"
position = "at"
payload = 'text = (next(SMODS.find_card("j_aij_mp_blind_drawn")) and not ((type == "host" and PVP.LOBBY.is_host) or (type == "guest" and not PVP.LOBBY.is_host))) and "???" or PVP.INSANE_INT.to_string(highest_score), -- All in Jest override'
match_indent = true

# AiJ Blind Functionality (5/5)
# Allows blinds to display a dynamic blind amount on blind select screen without changing the chip value directly
# Hooked into via new aij_blind_amount_display() method in blind objects
# Separate patch for multiplayer's overriden create_UIBox_blind_choice()
# create_UIBox_blind_choice()
[[patches]]
[patches.pattern]
target = '=[SMODS Multiplayer "ui/game.lua"]'
pattern = '''if
  G.GAME.round_resets.blind_choices[type] == "bl_mp_nemesis" or G.GAME.round_resets.pvp_blind_choices[type]
then
  blind_amt = "????"
end'''
position = "before"
match_indent = true
payload = '''
if All_in_Jest.aij_alias_type(blind_choice.config.aij_blind_amount_display) == 'function' then
    local blind_mult = blind_choice.config.mult
    if next(SMODS.find_card("j_aij_fall_of_count_chaligny")) then
        blind_mult = 1
    end
    ret = blind_choice.config:aij_blind_amount_display(blind_choice.config, get_blind_amount(G.GAME.round_resets.blind_ante), blind_mult)
    if All_in_Jest.aij_alias_type(ret) == "number" then
        blind_amt = ret * G.GAME.starting_params.ante_scaling
    end
elseif next(SMODS.find_card("j_aij_fall_of_count_chaligny")) then
    blind_amt = get_blind_amount(G.GAME.round_resets.blind_ante)*1*G.GAME.starting_params.ante_scaling
end
'''
