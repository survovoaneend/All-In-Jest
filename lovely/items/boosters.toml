[manifest]
version = "1.0.0"
dump_lua = true
priority = 214748364

# Guess the Jest (1/3)
# Prevents tooltip for Guess the Jest cards from appearing while hovering over cards in the pack (if 'Guess the Jest Names' is not enabled)
# Card:hover()
[[patches]]
[patches.regex]
target = "functions/UI_definitions.lua"
pattern = '(?<indent>[\t ]*)(?<main>SMODS\.create_mod_badges\(card\.config\.center, badges.*)'
position = "at"
line_prepend = "$indent"
payload = '''
if not (card.ability and card.ability.from_guess_the_jest) then
    $main
end
'''

# Guess the Jest (2/3)
# Clear info_queue if card is hidden
# generate_card_ui
[[patches]]
[patches.pattern]
target = "functions/common_events.lua"
pattern = "SMODS.compat_0_9_8.generate_UIBox_ability_table_card = nil"
position = "after"
match_indent = true
payload = '''
if card and card.ability and card.ability.from_guess_the_jest then
    info_queue = {}
end
'''

# Guess the Jest (3/3)
# Remove from_guess_the_jest attribute once joker has been selected
# Card:add_to_deck
[[patches]]
[patches.pattern]
target = "card.lua"
pattern = "if self.ability.set == 'Enhanced' or self.ability.set == 'Default' then"
position = "before"
match_indent = true
payload = '''
if self.ability and self.ability.from_guess_the_jest and self.ability.set == 'Joker' then
    self.ability.from_guess_the_jest = nil
end
'''
