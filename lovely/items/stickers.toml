[manifest]
version = "1.0.0"
dump_lua = true
priority = 214748364

# Allow calculating certain stickers through debuff
# eval_card()
[[patches]]
[patches.regex]
target = "functions/common_events.lua"
pattern = "if card.ability.rental then"
position = "before"
match_indent = true
payload = '''
local ret = {}
for _,k in ipairs(SMODS.Sticker.obj_buffer) do
    local v = SMODS.Stickers[k]
    if v.aij_calc_debuff or k == 'rental' then
        local sticker = card:calculate_sticker(context, k)
        if sticker then
            ret[v] = sticker
        end
    end
end
if next(ret) then
    return ret, {}
end
'''

# Perishable for Playing Cards
# Card:set_debuff()
[[patches]]
[patches.pattern]
target = "card.lua"
pattern = "if self.ability.perishable and self.ability.perish_tally <= 0 then"
position = "before"
match_indent = true
payload = '''
if self.ability.aij_pc_perishable and self.ability.perish_tally <= 0 then 
    if not self.debuff then
        self.debuff = true
        return
    end
end
'''

# Pinned playing cards (1/2)
# CardArea:align_cards()
[[patches]]
[patches.regex]
target = "cardarea.lua"
pattern = '''
(?<indent>[\t ]*)a\.pinned(?<post>.*)
'''
position = "at"
line_prepend = '$indent'
payload = '''
$indent(a.ability and a.ability.aij_pinned or a.pinned)$post
'''

# Pinned playing cards (2/2)
# CardArea:align_cards()
[[patches]]
[patches.regex]
target = "cardarea.lua"
pattern = '''
(?<indent>[\t ]*)b\.pinned(?<post>.*)
'''
position = "at"
line_prepend = '$indent'
payload = '''
$indent(b.ability and b.ability.aij_pinned or b.pinned)$post
'''


# Adds tooltip for special "stickers"
# (Mark of the Spear)
# generate_card_ui()
[[patches]]
[patches.pattern]
target = "functions/common_events.lua"
pattern = "if _c.set == 'Other' then"
position = "before"
match_indent = true
payload = '''
if (card and card.ability and card.ability.all_in_jest and card.ability.all_in_jest.perma_debuff) then 
    info_queue[#info_queue+1] = {key = 'aij_jest_mark_of_the_spear', set = 'Other'}
end
'''

# Add important comment to create_UIBox_your_collection_stickers function
[[patches]]
[patches.pattern]
target = '=[SMODS _ "src/ui.lua"]'
pattern = "create_UIBox_your_collection_stickers = function()"
position = "before"
payload = "-- Function overridden by All in Jest in Utils/overrides.lua"
match_indent = true

# Allow bomb stickers to calculate when being destroyed
# eval_card()
[[patches]]
[patches.regex]
target = 'functions/common_events.lua'
pattern = "(?<indent>[\t ]*)(?<pre>if not card:can_calculate\\(context\\.ignore_debuff, context\\.remove_playing_cards or context\\.joker_type_destroyed)(?<post>.*)"
position = "at"
line_prepend = "$indent"
payload = "$pre or context.destroy_card$post"

# Add a delay sprite feature for stickers
[[patches]]
[patches.regex]
target = '=[SMODS _ "src/card_draw.lua"]'
pattern = "(?<indent>[\t ]*)(?<pre>if self.ability\\[v\\.key\\])(?<post>.*)"
position = "at"
payload = "$pre and not (self.aij_delay_sticker and self.aij_delay_sticker[v.key])$post"
line_prepend = "$indent"
