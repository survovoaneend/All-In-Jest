[manifest]
version = "1.0.0"
dump_lua = true
priority = 214748364



# Silver Cards (1/2)
# Resets attributes to pre-silver stats when card enhancements are removed
# Card:set_base()
[[patches]]
[patches.pattern]
target = "card.lua"
pattern = """local was_added_to_deck = false
if self.added_to_deck and old_center and not self.debuff then"""
position = "before"
match_indent = true
payload = '''
if self.ability then self.ability.m_aij_charged_chaging = true end
if self.ability and self.ability.chipped_joker_chips_taken and self.ability.chipped_joker_chips_taken > 0 and SMODS.has_enhancement(self, 'm_stone') then
    local trigger = false
    if self.config.center.key == 'm_stone' then
        self.ability.bonus = self.config.center.config.bonus + self.ability.chipped_joker_chips_taken
        trigger = true
    end
    if trigger then self.ability.chipped_joker_chips_taken = nil end
end
local aij_silver_reapply = false
if self.edition and self.edition.aij_silver then
    if old_center ~= center and (self.ability.set == 'Enhanced' or self.ability.set == 'Default') then
        jest_ability_calculate(
        self,
        "/", tonumber(self.edition.prevextra),
        { 
          h_x_chips = 1, Xmult = 1, x_chips = 1, x_mult = 1, extra_value=true,
          bonus_x_score = 1, bonus_h_x_score = 1, bonus_x_blind_size = 1, bonus_h_x_blind_size = 1 -- latest SMODS stuff
        },
        nil, true, false, "ability"
        )
        aij_silver_reapply = true
    end
end
--Same thing but for misprinted
local aij_misprint_reapply = false
if self.edition and self.edition.aij_misprint then
    if old_center ~= center and (self.ability.set == 'Enhanced' or self.ability.set == 'Default') then
        jest_ability_calculate(
        self,
        "/", tonumber(self.edition.prevmult),
        { 
          h_x_chips = 1, Xmult = 1, x_chips = 1, x_mult = 1, extra_value=true,
          bonus_x_score = 1, bonus_h_x_score = 1, bonus_x_blind_size = 1, bonus_h_x_blind_size = 1 -- latest SMODS stuff
        },
        nil, true, false, "ability"
        )
        aij_misprint_reapply = true
    end
end
'''
# Silver Cards (2/2)
# Re-applies attributes to pre-silver stats when new enhancements are applied
# Card:set_base()
[[patches]]
[patches.pattern]
target = "card.lua"
pattern = 'if not initial and G.GAME.blind then G.GAME.blind:debuff_card(self) end'
position = "before"
match_indent = true
payload = '''
if self.edition and self.edition.aij_silver then
    if aij_silver_reapply and (self.ability.set == 'Enhanced' or self.ability.set == 'Default') then
        jest_ability_calculate(
        self,
        "*", self.edition.extra,
        {
          h_x_chips = 1, Xmult = 1, x_chips = 1, x_mult = 1, extra_value=true,
          bonus_x_score = 1, bonus_h_x_score = 1, bonus_x_blind_size = 1, bonus_h_x_blind_size = 1 -- latest SMODS stuff
        },
        nil, true, false, "ability"
        )
    end
end
--Same thing but for misprinted
if self.edition and self.edition.aij_misprint then
    if aij_misprint_reapply and (self.ability.set == 'Enhanced' or self.ability.set == 'Default') then
        jest_ability_calculate(
        self,
        "*", self.edition.mult,
        {
          h_x_chips = 1, Xmult = 1, x_chips = 1, x_mult = 1, extra_value=true,
          bonus_x_score = 1, bonus_h_x_score = 1, bonus_x_blind_size = 1, bonus_h_x_blind_size = 1 -- latest SMODS stuff
        },
        nil, true, false, "ability"
        )
    end
end
if self.ability then self.ability.m_aij_charged_chaging = nil end
'''