[manifest]
version = "1.0.0"
dump_lua = true
priority = 214748364

# Bullet King (1/3)
# Scored cards act as in hand
# SMODS.score_card()
[[patches]]
[patches.pattern]
target = '=[SMODS _ "src/utils.lua"]'
match_indent = true
position = 'after'
pattern = '''
card.lucky_trigger = nil
'''
payload = '''
local bullet_kings = SMODS.find_card('j_aij_bullet_king')
if next(bullet_kings) and context.cardarea == G.play and card:get_id() == 13 then
    context.cardarea = G.hand
    card.bullet_king = bullet_kings[1]
    SMODS.score_card(card, context)
    context.cardarea = G.play
end
-- For Bouffon
if next(SMODS.find_card("j_aij_bouffon")) and context.cardarea == G.deck then
    for k, v in pairs(SMODS.find_card("j_aij_bouffon")) do
        for i = 1, v.ability.extra.cards do
            local bouf_card = G.deck.cards[#G.deck.cards-(v.ability.extra.cards-i)]
            if bouf_card and bouf_card == card then
                context.cardarea = G.hand
                SMODS.score_card(card, context)
                context.cardarea = G.deck
            end
        end
    end
end
if card.seal and card.seal == 'aij_eye' and context.cardarea == G.deck then
    context.cardarea = G.hand
    SMODS.score_card(card, context)
    context.cardarea = G.deck
end
if next(SMODS.find_card("j_aij_ninja")) and context.cardarea == G.play and not context.j_aij_ninja_triggered and #context.scoring_hand > 1 then
    for k, v in pairs(SMODS.find_card("j_aij_ninja")) do
        if card == context.scoring_hand[#context.scoring_hand] then
            context.j_aij_ninja_triggered = true
            card_eval_status_text(context.scoring_hand[1], 'extra', nil, nil, nil, {
                message = localize('k_again_ex'),
                colour = G.C.FILTER
            })
            SMODS.score_card((context.scoring_hand)[1], context)
            context.j_aij_ninja_triggered = nil
        end
    end
end
'''
# Bullet King (2/3) 
# Scored cards trigger end of round in hand effects
# G.FUNCS.evaluate_play()
[[patches]]
[patches.pattern]
target = 'functions/state_events.lua'
match_indent = true
position = 'after'
pattern = '''
hand_chips = mod_chips(nu_chip or hand_chips)
'''
payload = '''
local bullet_kings = SMODS.find_card('j_aij_bullet_king')
if next(bullet_kings) then
    All_in_Jest.bullet_king_end_of_round({cardarea = G.hand, end_of_round = true, beat_boss = G.GAME.blind.boss }, G.play.cards, bullet_kings[1])
end
'''
# Bullet King (3/3)
# Raised Fist compat
# Card:calculate_joker()
[[patches]]
[patches.pattern]
target = 'card.lua'
match_indent = true
position = 'before'
pattern = '''
if raised_card == context.other_card then 
'''
payload = '''
if next(SMODS.find_card('j_aij_bullet_king')) then
    for i=1, #G.play.cards do
        if temp_ID >= G.play.cards[i].base.id and not SMODS.has_no_rank(G.play.cards[i]) and card.bullet_king then 
            temp_Mult = G.play.cards[i].base.nominal
            temp_ID = G.play.cards[i].base.id
            raised_card = G.play.cards[i]
        end
    end
end
'''



# The Treachery Of Jokers 
# Make joker go into Consumable slot instead of joker slot
# Also make advanced copier jokers (joker.png, what's left, etc.) go into consumable slot if they're copying ToJ
# CardArea:emplace()
[[patches]] 
[patches.pattern]
target = "cardarea.lua"
pattern = '''
if location == 'front' or self.config.type == 'deck' then 
'''
position = "before"
payload = '''
if self == G.jokers then
    if card.config.center.key == 'j_aij_the_treachery_of_jokers' then
        self = G.consumeables
    end
    if card.ability[card.config.center.key] and card.ability[card.config.center.key].copied_joker_key == 'j_aij_the_treachery_of_jokers' then
        self = G.consumeables
    end
    if card.ability[card.config.center.key] and card.ability[card.config.center.key].copied_joker_abilities then
        local move = false
        local copier_ability = card.ability[card.config.center.key]
        for index = #copier_ability.copied_joker_abilities, math.max(1, #copier_ability.copied_joker_abilities - copier_ability.copy_limit + 1), -1 do
            local copied_ability = copier_ability.copied_joker_abilities[index]
            if copied_ability.key == "j_aij_the_treachery_of_jokers" then
                move = true
                break
            end
        end
        if move then
            self = G.consumeables
        end
    end
end
'''
match_indent = true



