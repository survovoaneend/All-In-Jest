# Circuit Diagram (1/1)
# Move charged cards to the top of the deck after shuffling
# CardArea:shuffle()
[[patches]]
[patches.pattern]
target = "cardarea.lua"
pattern = "pseudoshuffle(self.cards, pseudoseed(_seed or 'shuffle'))"
position = "after"
payload = '''
local has_circuit_diagram = next(SMODS.find_card("j_aij_circuit_diagram"))
if has_circuit_diagram then
    for i = #self.cards, 1, -1 do
        local card = self.cards[i]
        if SMODS.has_enhancement(card, 'm_aij_charged') then
            table.remove(self.cards, i)
            table.insert(self.cards, #self.cards + 1, card)
        end
    end
end
for i = #self.cards, 1, -1 do
    local card = self.cards[i]
    if SMODS.has_enhancement(card, 'm_aij_cloud') then
        table.remove(self.cards, i)

        local half = math.floor(#self.cards / 2)
        local pos = pseudorandom('jest_astrology_tag', half + 1, #self.cards + 1)

        table.insert(self.cards, pos, card)
    end
end

'''
match_indent = true

